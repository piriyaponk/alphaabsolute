name: AlphaAbsolute-TH Watchdog

# Triggered by cron-job.org at 09:30 UTC = 16:30 ICT every weekday (after SET close).
# Do NOT use GH Actions schedule: — free tier delays cron jobs 1-3 hours.
#
# cron-job.org setup:
#   URL: https://api.github.com/repos/piriyaponk/alphaabsolute/actions/workflows/thai_watchdog.yml/dispatches
#   Method: POST | Every weekday 09:30 UTC (Mon-Fri)
#   Headers: Authorization: Bearer <PAT>  |  Content-Type: application/json
#   Body: {"ref":"main"}
#
# The watchdog script itself skips SET holidays — no alert fired on those days.

on:
  schedule:
    - cron: '30 9 * * 1-5'   # 09:30 UTC Mon-Fri = 16:30 ICT after SET close (may delay 1-2hr)
  workflow_dispatch:            # cron-job.org backup + manual run

concurrency:
  group: thai-watchdog
  cancel-in-progress: false     # queue second trigger; don't cancel running job

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Restore thai_ohlcv.db from cache
        uses: actions/cache@v4
        with:
          path: data/research/thai_ohlcv.db
          key: thai-ohlcv-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            thai-ohlcv-db-${{ runner.os }}-

      - name: Update thai_ohlcv.db
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -X utf8 scripts/research/thai_data_layer.py --update 2>&1 | tail -5

      - name: DB integrity check
        id: db_integrity
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING:   utf-8
        run: |
          python -X utf8 - <<'PYEOF'
          import sys, os, urllib.request, json, ssl
          sys.path.insert(0, "scripts/research")
          from entry_screen_db import check_integrity

          r = check_integrity()
          size_mb = r["size_bytes"] / 1_048_576
          print(f"[integrity] size={size_mb:.1f}MB rows={r['row_count']:,} cols={r['col_count']} max_date={r['max_date']}")

          # ── Integrity check ──────────────────────────────────────────────────
          if not r["integrity_ok"]:
              msg = f"🚨 [TH] DB INTEGRITY FAIL\n{r['integrity_msg']}\nRun: git checkout HEAD -- data/research/thai_ohlcv.db"
              print(msg)
              try:
                  tok = os.environ.get("TELEGRAM_BOT_TOKEN","")
                  chat = os.environ.get("TELEGRAM_CHAT_ID","")
                  if tok and chat:
                      ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
                      urllib.request.urlopen(
                          urllib.request.Request(
                              f"https://api.telegram.org/bot{tok}/sendMessage",
                              data=json.dumps({"chat_id":chat,"text":msg}).encode(),
                              headers={"Content-Type":"application/json"}),
                          context=ctx, timeout=10)
              except Exception: pass
              sys.exit(1)

          # ── Size anomaly check (< 5 MB = suspiciously small, > 500 MB = too large) ──
          MIN_MB, MAX_MB = 5, 500
          if size_mb < MIN_MB or size_mb > MAX_MB:
              msg = f"⚠️ [TH] DB SIZE ANOMALY: {size_mb:.1f} MB (expected {MIN_MB}–{MAX_MB} MB)"
              print(msg)
              try:
                  tok = os.environ.get("TELEGRAM_BOT_TOKEN","")
                  chat = os.environ.get("TELEGRAM_CHAT_ID","")
                  if tok and chat:
                      ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
                      urllib.request.urlopen(
                          urllib.request.Request(
                              f"https://api.telegram.org/bot{tok}/sendMessage",
                              data=json.dumps({"chat_id":chat,"text":msg}).encode(),
                              headers={"Content-Type":"application/json"}),
                          context=ctx, timeout=10)
              except Exception: pass
              sys.exit(1)

          print("[integrity] ✅ OK")
          PYEOF

      - name: Run watchdog
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING:   utf-8
        run: |
          python -X utf8 scripts/research/thai_data_watchdog.py 2>&1

      # NOTE: watchdog does NOT commit thai_ohlcv.db back to git.
      # DB writes come from thai_paper_trade.yml only (single writer = no overwrite race).
      # Watchdog only reads DB + sends alert — it is a read-only consumer.
