name: AlphaAbsolute Sunday Research — System 4

# Sunday 07:00 Bangkok (ICT) = Sunday 00:00 UTC
# S4 research loop: optimizer + hypothesis tester + chief quant
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  sunday-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        run: |
          mkdir -p data/paper_trading \
                   data/research \
                   data/board \
                   data/rs_universe \
                   output

      - name: Research Hunter — fetch papers from arXiv, SSRN, AQR
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/brain/research_hunter.py
        continue-on-error: true

      - name: Signal Extractor — extract hypotheses from notes
        run: python scripts/brain/signal_extractor.py
        continue-on-error: true

      - name: System Optimizer — grid search configs beating S4 baseline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/brain/system_optimizer.py 50
        continue-on-error: true

      - name: Hypothesis Tester — backtest pending hypotheses vs S4 baseline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/brain/hypothesis_tester.py
        continue-on-error: true

      - name: Chief Quant — cross-signal synthesis, propose improvements
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/brain/chief_quant.py
        continue-on-error: true

      - name: Commit any outputs
        run: |
          git config user.name  "AlphaAbsolute Bot"
          git config user.email "bot@alphaabsolute.ai"
          git add data/ output/ || true
          git diff --cached --quiet || \
            git commit -m "auto: sunday research $(date -u +%Y-%m-%d)"
          git push || true
