name: AlphaAbsolute v2 Weekly Benchmark

# Saturday 06:00 Bangkok time = Friday 23:00 UTC
# Rebuilds: full universe (5,021 tickers) + OHLCV disk cache + benchmark distribution
# Takes ~60-75 min total — daily runs depend on this artifact
on:
  schedule:
    - cron: '0 23 * * 5'    # Friday 23:00 UTC → Saturday 06:00 ICT
  workflow_dispatch:          # Manual trigger from GitHub UI

jobs:
  weekly-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120      # 2-hour cap — full OHLCV fetch can take ~60 min
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        run: |
          mkdir -p data/universe \
                   data/rs_universe \
                   data/runner_logs

      - name: Step 1 — Rebuild full universe (NYSE + NASDAQ ~5,021 tickers)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          TIINGO_API_KEY:  ${{ secrets.TIINGO_API_KEY }}
          FMP_API_KEY:     ${{ secrets.FMP_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/pre_compute/universe_builder.py

      - name: Step 2 — Build RS benchmark distribution from OHLCV cache
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          TIINGO_API_KEY:  ${{ secrets.TIINGO_API_KEY }}
          FMP_API_KEY:     ${{ secrets.FMP_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        # Forces benchmark build regardless of day-of-week check
        run: python scripts/runners/pre_market_runner.py --step a03_bench

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
import os, json, ssl, urllib.request
token = os.environ.get('TELEGRAM_BOT_TOKEN','')
chat  = os.environ.get('TELEGRAM_CHAT_ID','')
if not token or not chat: exit()
msg = '[WEEKLY] FAIL — weekly benchmark job failed.\nRS benchmark may NOT have been rebuilt this week.\nRS data will go stale.\nCheck: https://github.com/piriyaponk/alphaabsolute/actions/workflows/weekly.yml'
ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
payload = json.dumps({'chat_id': chat, 'text': msg}).encode()
req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=payload, headers={'Content-Type':'application/json'})
urllib.request.urlopen(req, context=ctx, timeout=10)
" || true

      - name: Commit rebuilt artifacts to repo
        run: |
          git config user.name  "AlphaAbsolute Bot"
          git config user.email "bot@alphaabsolute.ai"
          git add \
            data/universe/full_universe.json \
            data/rs_universe/benchmark_distribution.json \
            data/rs_universe/benchmark_tickers.json \
            data/runner_logs/ || true
          git diff --cached --quiet || \
            git commit -m "auto: weekly benchmark rebuild $(date -u +%Y-%m-%d)"
          git push || true
