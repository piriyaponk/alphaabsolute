name: AlphaAbsolute Monthly Report

# 1st of each month, 09:00 Bangkok = 02:00 UTC
on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore SQLite databases from cache
        uses: actions/cache@v4
        with:
          path: |
            data/ohlcv.db
            data/breadth/breadth_prices.db
          key: sqlite-${{ steps.cachekey.outputs.key }}
          restore-keys: |
            sqlite-

      - name: Create required directories
        run: |
          mkdir -p data/calibration data/postmortems data/portfolio \
                   data/runner_logs data/health output/postmortems

      - name: Run monthly pipeline
        env:
          POLYGON_API_KEY:    ${{ secrets.POLYGON_API_KEY }}
          TIINGO_API_KEY:     ${{ secrets.TIINGO_API_KEY }}
          FMP_API_KEY:        ${{ secrets.FMP_API_KEY }}
          FINNHUB_API_KEY:    ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY:       ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPHAABSOLUTE_CI:   "1"
        run: python scripts/runners/pre_market_runner.py --mode monthly

      - name: Commit calibration + performance artifacts
        run: |
          git config user.name  "AlphaAbsolute Bot"
          git config user.email "bot@alphaabsolute.ai"
          git add data/calibration/    2>/dev/null || true
          git add data/postmortems/    2>/dev/null || true
          git add data/runner_logs/    2>/dev/null || true
          git add data/health/         2>/dev/null || true
          git add output/performance_*.md   2>/dev/null || true
          git add output/postmortems/  2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "auto: monthly report $(date -u +%Y-%m)"
          git push || true
