name: AlphaAbsolute v2 Monthly Report

# 1st of each month, 09:00 Bangkok time = 02:00 UTC
# Runs Bayesian signal calibration + full performance report vs QQQ
on:
  schedule:
    - cron: '0 2 1 * *'      # 1st of every month, 02:00 UTC = 09:00 ICT
  workflow_dispatch:           # Manual trigger from GitHub UI

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        run: |
          mkdir -p data/calibration \
                   data/postmortems \
                   data/portfolio \
                   data/runner_logs \
                   output/postmortems

      - name: Run monthly pipeline (Bayesian calibration + performance report)
        env:
          POLYGON_API_KEY:    ${{ secrets.POLYGON_API_KEY }}
          TIINGO_API_KEY:     ${{ secrets.TIINGO_API_KEY }}
          FMP_API_KEY:        ${{ secrets.FMP_API_KEY }}
          FINNHUB_API_KEY:    ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY:       ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/runners/pre_market_runner.py --mode monthly

      - name: Commit calibration + performance artifacts
        run: |
          git config user.name  "AlphaAbsolute Bot"
          git config user.email "bot@alphaabsolute.ai"
          git add \
            data/themes/ticker_labels.json \
            data/themes/description_cache.json \
            data/calibration/signal_weights.json \
            data/postmortems/ \
            data/runner_logs/ \
            output/performance_*.md \
            output/postmortems/ || true
          git diff --cached --quiet || \
            git commit -m "auto: monthly report + calibration $(date -u +%Y-%m)"
          git push || true
