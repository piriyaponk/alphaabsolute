name: AlphaAbsolute-US — Daily

# Triggered by cron-job.org at 00:00 UTC = 07:00 Bangkok every day.
# Do NOT use GH Actions schedule: — free tier delays cron jobs 1-3 hours.
#
# cron-job.org setup:
#   URL: https://api.github.com/repos/piriyaponk/AlphaAbsolute/actions/workflows/daily.yml/dispatches
#   Method: POST | Every day 00:00 UTC
#   Headers: Authorization: Bearer <PAT>  |  Content-Type: application/json
#   Body: {"ref":"main"}
#
# Script auto-detects month-end and switches to full rebalance mode automatically.

on:
  # schedule: block removed — cron-job.org dispatches via workflow_dispatch.
  # GH Actions free-tier schedule is unreliable (+1-3h delay) and would cause
  # a double-trigger alongside cron-job.org POST to workflow_dispatch.
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily (auto-detect) | rebalance (force)'
        required: false
        default: 'daily'

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy pyarrow requests --quiet

      - name: Run paper trader
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/paper_trading/v4_paper_trader.py \
            --mode ${{ github.event.inputs.mode || 'daily' }}

      - name: Verify prices (Tiingo vs TradingView cross-check)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          python scripts/paper_trading/v4_price_verifier.py || true

      - name: Restore PULSE-US OHLCV cache
        uses: actions/cache@v4
        with:
          path: data/research/pulse_us/pulse_us_ohlcv.db
          key: pulse-us-ohlcv-${{ runner.os }}-v1
          restore-keys: |
            pulse-us-ohlcv-${{ runner.os }}-

      - name: Update PULSE-US OHLCV data
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          python scripts/research/pulse_us/pulse_us_data_layer.py

      - name: Check RS data freshness
        id: rs_check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import json, os, sys
          from datetime import datetime
          from pathlib import Path
          p = Path('data/rs_universe/latest.json')
          if not p.exists():
              print('ERROR: data/rs_universe/latest.json not found — PULSE-US screens skipped')
              import requests
              t = os.environ.get('TELEGRAM_BOT_TOKEN')
              c = os.environ.get('TELEGRAM_CHAT_ID')
              if t and c:
                  requests.post(f'https://api.telegram.org/bot{t}/sendMessage',
                                json={'chat_id':c,'text':'[US] PULSE-US SKIP: RS file missing. Run rs_ranker.py first.'},timeout=10)
              sys.exit(1)
          d = json.load(open(p))
          rs_date = d.get('date','')[:10]
          if rs_date:
              age = (datetime.utcnow() - datetime.strptime(rs_date,'%Y-%m-%d')).days
              print(f'RS date: {rs_date} (age {age}d)')
              if age > 7:
                  print(f'WARNING: RS data is {age} days old — signals may be stale')
                  import requests
                  t = os.environ.get('TELEGRAM_BOT_TOKEN')
                  c = os.environ.get('TELEGRAM_CHAT_ID')
                  if t and c:
                      requests.post(f'https://api.telegram.org/bot{t}/sendMessage',
                                    json={'chat_id':c,'text':f'[US] PULSE-US WARNING: RS data is {age}d old ({rs_date}). Stale signals possible.'},timeout=10)
          "

      - name: Run PULSE-US Best Final screen
        id: pulse_best_final
        if: steps.rs_check.outcome == 'success'
        run: |
          python scripts/research/pulse_us/pulse_us_best_final.py --no-telegram

      - name: Alert on PULSE-US Best Final failure
        if: failure() && steps.pulse_best_final.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import os, requests
          t = os.environ.get('TELEGRAM_BOT_TOKEN')
          c = os.environ.get('TELEGRAM_CHAT_ID')
          if t and c:
              requests.post(f'https://api.telegram.org/bot{t}/sendMessage',
                            json={'chat_id':c,'text':'[US] PULSE-US Best Final FAILED — check GitHub Actions logs'},timeout=10)
          " || true

      - name: Run PULSE-US Daily (multi-signal)
        id: pulse_daily
        if: steps.rs_check.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/research/pulse_us/pulse_us_daily.py

      - name: Alert on PULSE-US Daily failure
        if: failure() && steps.pulse_daily.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import os, requests
          t = os.environ.get('TELEGRAM_BOT_TOKEN')
          c = os.environ.get('TELEGRAM_CHAT_ID')
          if t and c:
              requests.post(f'https://api.telegram.org/bot{t}/sendMessage',
                            json={'chat_id':c,'text':'[US] PULSE-US Daily FAILED — check GitHub Actions logs'},timeout=10)
          " || true

      - name: Commit state update
        run: |
          git config user.name "AlphaAbsolute Bot"
          git config user.email "bot@alphaabsolute.local"
          git add data/paper_trading/state.json data/paper_trading/price_verify_latest.json data/research/pulse_us/pulse_us_best_final_signals.json data/research/pulse_us/pulse_us_daily_signals.json
          git diff --staged --quiet || git commit -m "paper: state $(date -u +%Y-%m-%d)"
          git push
