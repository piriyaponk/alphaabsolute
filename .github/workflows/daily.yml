name: AlphaAbsolute v4.0 Paper Trading — Daily

# Triggered by cron-job.org at 00:00 UTC = 07:00 Bangkok every day.
# Do NOT use GH Actions schedule: — free tier delays cron jobs 1-3 hours.
#
# cron-job.org setup:
#   URL: https://api.github.com/repos/piriyaponk/AlphaAbsolute/actions/workflows/daily.yml/dispatches
#   Method: POST | Every day 00:00 UTC
#   Headers: Authorization: Bearer <PAT>  |  Content-Type: application/json
#   Body: {"ref":"main"}
#
# Script auto-detects month-end and switches to full rebalance mode automatically.

on:
  schedule:
    - cron: '0 0 * * 1-5'    # 00:00 UTC = 07:00 BKK, Mon-Fri (production)
    - cron: '15 13 3 9 *'    # 13:15 UTC = 20:15 BKK, 3 Sep only (test run)
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily (auto-detect) | rebalance (force)'
        required: false
        default: 'daily'

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy pyarrow requests --quiet

      - name: Run paper trader
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/paper_trading/v4_paper_trader.py \
            --mode ${{ github.event.inputs.mode || 'daily' }}

      - name: Commit state update
        run: |
          git config user.name "AlphaAbsolute Bot"
          git config user.email "bot@alphaabsolute.local"
          git add data/paper_trading/state.json
          git diff --staged --quiet || git commit -m "paper: state $(date -u +%Y-%m-%d)"
          git push
