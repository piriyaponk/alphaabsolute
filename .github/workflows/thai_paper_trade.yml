name: AlphaAbsolute-TH Paper Trade

on:
  schedule:
    # 12:00 UTC = 19:00 ICT (2.5 hrs after SET close — Yahoo EOD reliably available)
    - cron: '0 12 * * 1-5'
  workflow_dispatch:   # manual trigger

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Pull latest DB & state
        run: git pull --rebase origin main || true

      - name: Update thai_ohlcv.db
        id: update_db
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -X utf8 scripts/research/thai_data_layer.py --update 2>&1 | tail -30

      - name: Alert on DB update failure
        if: failure() && steps.update_db.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING:   utf-8
        run: |
          python -X utf8 scripts/research/thai_paper_trader.py --alert-fail "update_db" || true

      - name: Run paper trader
        id: paper_trader
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING:   utf-8
        run: |
          python -X utf8 scripts/research/thai_paper_trader.py 2>&1

      - name: Alert on paper trader failure
        if: failure() && steps.paper_trader.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING:   utf-8
        run: |
          python -X utf8 scripts/research/thai_paper_trader.py --alert-fail "paper_trader" || true

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/research/thai_paper_portfolio.json \
                  data/research/thai_paper_log.json \
                  data/research/thai_ohlcv.db || true
          git diff --staged --quiet || \
            git commit -m "th-paper: daily update $(date -u +%Y-%m-%d)"
          git push || true
