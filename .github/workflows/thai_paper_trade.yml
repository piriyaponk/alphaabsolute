name: AlphaAbsolute-TH Paper Trade

# Triggered by cron-job.org at 00:00 UTC = 07:00 ICT every weekday.
# Do NOT use GH Actions schedule: — free tier delays cron jobs 1-3 hours.
#
# cron-job.org setup:
#   URL: https://api.github.com/repos/piriyaponk/alphaabsolute/actions/workflows/thai_paper_trade.yml/dispatches
#   Method: POST | Every weekday 00:00 UTC (Mon-Fri)
#   Headers: Authorization: Bearer <PAT>  |  Content-Type: application/json
#   Body: {"ref":"main"}

on:
  schedule:
    - cron: '0 0 * * 1-5'    # 00:00 UTC Mon-Fri = 07:00 ICT (GH free tier may delay 1-2hr)
  workflow_dispatch:            # cron-job.org backup + manual

permissions:
  contents: write

# Prevent double-run: queues a second trigger instead of running concurrently.
# After the first run pushes last_update=today, the queued run will hit the
# pre-check below and exit early.
concurrency:
  group: thai-paper-trade
  cancel-in-progress: false

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Pre-check — skip if already ran today
        id: date_check
        run: |
          python3 -c "
          import json, sys
          from datetime import date
          today = str(date.today())
          try:
              with open('data/research/thai_paper_portfolio.json') as f:
                  state = json.load(f)
              lu = state.get('last_update', '')
              if lu == today:
                  print(f'already_ran=true')
                  sys.exit(0)
              print(f'last_update={lu} → running')
          except Exception:
              print('state not found → running')
          " >> \$GITHUB_OUTPUT || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Pull latest state
        run: git pull --rebase origin main || true

      - name: Restore thai_ohlcv.db from cache
        id: cache_db
        uses: actions/cache@v4
        with:
          path: data/research/thai_ohlcv.db
          key: thai-ohlcv-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            thai-ohlcv-db-${{ runner.os }}-

      - name: Update thai_ohlcv.db
        id: update_db
        if: steps.date_check.outputs.already_ran != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -X utf8 scripts/research/thai_data_layer.py --update 2>&1 | tail -30

      - name: Alert on DB update failure
        if: failure() && steps.update_db.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING:   utf-8
        run: |
          python -X utf8 scripts/research/thai_paper_trader.py --alert-fail "update_db" || true

      - name: Update PULSE-TH signals
        id: pulse_screen
        if: steps.date_check.outputs.already_ran != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -X utf8 scripts/research/thai_entry_screen.py 2>&1 | tail -20

      - name: Fill combo columns for new rows
        if: steps.date_check.outputs.already_ran != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -X utf8 scripts/research/thai_fill_combo_columns.py 2>&1 | tail -10

      - name: Run PULSE-TH screener
        id: pulse_th
        if: steps.date_check.outputs.already_ran != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING:   utf-8
        run: |
          python -X utf8 scripts/research/thai_pulse/thai_pulse_daily.py 2>&1

      - name: Alert on PULSE-TH failure
        if: failure() && steps.pulse_th.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING:   utf-8
        run: |
          python -X utf8 scripts/research/thai_paper_trader.py --alert-fail "pulse_th" || true

      - name: Run paper trader
        id: paper_trader
        if: steps.date_check.outputs.already_ran != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING:   utf-8
        run: |
          python -X utf8 scripts/research/thai_paper_trader.py 2>&1

      - name: Alert on paper trader failure
        if: failure() && steps.paper_trader.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING:   utf-8
        run: |
          python -X utf8 scripts/research/thai_paper_trader.py --alert-fail "paper_trader" || true

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/research/thai_paper_portfolio.json \
                  data/research/thai_paper_log.json \
                  data/research/thai_entry_screen_results.csv \
                  data/research/thai_entry_screen_summary.csv \
                  data/research/thai_ohlcv.db \
                  data/research/set_universe.json \
                  data/research/thai_pulse/pulse_th_daily_signals.json || true
          git diff --staged --quiet || \
            git commit -m "th-paper: daily update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main && git push
